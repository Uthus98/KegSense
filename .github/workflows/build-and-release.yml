name: Build firmware

on:
  push:
    branches: [main, v2-refactor]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run
      - name: Prepare firmware image
        run: cp .pio/build/esp32dev/firmware.bin KegSense-firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: KegSense-firmware
          path: KegSense-firmware.bin
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "KegSense-firmware.bin#KegSense-${{ github.ref_name }}.bin" --generate-notes --prerelease --title "KegSense ${{ github.ref_name }}"
